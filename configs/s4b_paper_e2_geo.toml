# E2: geometric figures only (no brain): random spheres and cylinders in chi, 64^3, SNR 30-120, 15000 steps x batch 2 = 30,000 volumes
# Paper-recipe replication (CLAUDE.md 9bo). Reference recipe: configs/s4b_noise_clean.toml. Sim2 (dataRC2) is monitored only.
# Dipolelet parameters are those of utils/Dipole-lets_Paper_Plots_3.ipynb (cell 19).

[data]
rc1 = "dataRC1"        # check slab, input scale, phase scale only (no RC1 voxel reaches a training patch)
rc2 = "dataRC2"        # monitoring only
field_strength = 7.0   # T of Sim2 (Hz -> ppm)

[data.geometric]       # brain-free training volumes (patch = the whole 64^3 volume)
mask = "ellipsoid"
magnitude = 0.264      # mean RC1 weight; the nets break when the weight channel leaves 0.13-0.38 (CLAUDE.md 9u)
magnitude_variation = 0.3

[data.holdout]
axis = 0               # check slab for checkpoint selection: train x in [0,100), gap 12, test [112,160) = 15% of the brain
train_fraction = 0.625
gap = 12

[artifacts]
snr_low = 30.0
snr_high = 120.0
outside = "clean"

[artifacts.weights]
noise = 1.0
clean = 0.25

[objects]
probability = 0.7      # rotated/rescaled heads; the 24 cube rotations move the z axis (B0 stays z) onto x or y
max_angle_deg = 20.0
scale = [0.9, 1.1]

[dipolelet]
scales = 3
scaling_law = "static"
base_angular_bands = 3
delta = 0.05
window = "gaussian"
gaussian_width_factor = 0.5
starlet = "gaussian"
starlet_sigma = 0.5

[model]
channels = 16
blocks = 4
dilations = [1, 2, 4]
k_conditioning = true
checkpoint = true

[training]
steps = 15000
learning_rate = 0.001
weight_decay = 0.0
grad_clip = 1.0
seed = 42
device = "auto"
patch = 64
batch_size = 2
l1_weight = 1.0
l2_weight = 1.0
cone_weight = 0.0
log_every = 50
eval_every = 250
save_every = 250
output = "runs/s4b_paper_e2_geo"
