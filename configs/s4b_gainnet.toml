# CLAUDE.md 9az: Dipole-let gain network (3D U-Net, spatially varying passive gains, NOT an FNO) trained THROUGH the frozen noise_clean network.
# Data = noise_clean recipe + modelled real residuals with noise + true strong sources (spheres_chi, calc_shell) so that sources are preserved; the measured tissue residual (exp7) is never trained on.
# Sim2 (dataRC2) is monitored only, never trained on or used for selection.
# Dipolelet parameters are those of utils/Dipole-lets_Paper_Plots_3.ipynb (cell 19).

[data]
rc1 = "dataRC1"
rc2 = "dataRC2"        # monitoring only
field_strength = 7.0   # T of Sim2 (Hz -> ppm)

[data.holdout]
axis = 0               # check slab for checkpoint selection: train x in [0,100), gap 12, test [112,160) = 15% of the brain
train_fraction = 0.625
gap = 12

[artifacts]
snr_low = 40.0
snr_high = 200.0
outside = "clean"

[artifacts.weights]
noise = 1.0
clean = 0.25
sti_noise = 0.5
offdiag_noise = 0.5
spheres_chi = 0.5
calc_shell = 0.5

[objects]
probability = 0.7      # rotated/rescaled heads (real-psi families are never used on them)
max_angle_deg = 20.0
scale = [0.9, 1.1]

[dipolelet]
scales = 3
scaling_law = "static"
base_angular_bands = 3
delta = 0.05
window = "gaussian"
gaussian_width_factor = 0.5
starlet = "gaussian"
starlet_sigma = 0.5
coarse_bands = 3      # coarse remainder split in 3 |D| bands: 12 segments (9aq)

[model]
kind = "gain_cascade"
stage_b = "runs/s4b_noise_clean/best.pt"     # frozen stage B (3 x 3 + coarse, 10 segments, its own Dipole-let settings are read from the checkpoint)
base = 16                                    # U-Net base channels
rho = 6.0
amp_sigma = 3.0
checkpoint = true
# passive g1 of the real regime (scripts/check_passive_filter.py, 9au; fitted on RC1 STI/off-diagonal + noise, never on tissue) and the regime map of 9ar
g1 = [0.0, 0.0, 0.398, 0.0, 0.744, 1.0, 0.0, 0.773, 0.828, 0.0, 0.674, 0.919]
w = [0.0, 0.0, 6.0, 0.0]
c = 9.0848

[training]
steps = 6000
learning_rate = 0.001
weight_decay = 0.0
grad_clip = 1.0
seed = 42
device = "auto"
patch = 96
batch_size = 2
l1_weight = 1.0
l2_weight = 1.0
cone_weight = 0.0
log_every = 50
eval_every = 250
save_every = 250
output = "runs/s4b_gainnet"
