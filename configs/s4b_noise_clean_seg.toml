# S4b: train on RC1 + artifacts (noise_clean_seg = noise_clean + Dipole-let sensitivity-weighted loss, CLAUDE.md 9aj); Sim2 (dataRC2) is monitored only, never trained on or used for selection.
# Dipolelet parameters are those of utils/Dipole-lets_Paper_Plots_3.ipynb (cell 19).

[data]
rc1 = "dataRC1"
rc2 = "dataRC2"        # monitoring only
field_strength = 7.0   # T of Sim2 (Hz -> ppm)

[data.holdout]
axis = 0               # check slab for checkpoint selection: train x in [0,100), gap 12, test [112,160) = 15% of the brain
train_fraction = 0.625
gap = 12

[artifacts]
snr_low = 40.0
snr_high = 200.0
outside = "clean"

[artifacts.weights]
noise = 1.0
clean = 0.25

[objects]
probability = 0.7      # rotated/rescaled heads (real-psi families are never used on them)
max_angle_deg = 20.0
scale = [0.9, 1.1]

[dipolelet]
scales = 3
scaling_law = "static"
base_angular_bands = 3
delta = 0.05
window = "gaussian"
gaussian_width_factor = 0.5
starlet = "gaussian"
starlet_sigma = 0.5

[model]
channels = 16
blocks = 4
dilations = [1, 2, 4]
k_conditioning = true
checkpoint = true

[training]
steps = 6000
learning_rate = 0.001
weight_decay = 0.0
grad_clip = 1.0
seed = 42
device = "auto"
patch = 96
batch_size = 2
l1_weight = 1.0
l2_weight = 1.0
cone_weight = 0.0
segment_weight = 1.0   # L_seg = sqrt(sum_s g_s^2 ||M e_s||^2) / ||M b||, added to L1 + L2
# g_s: eNDI sensitivity per Dipole-let segment measured on RC1 (runs/segments_rc1, not on Sim2), normalized to mean square 1.
# Order: scale1/band0..2, scale2/band0..2, scale3/band0..2, coarse.
segment_gains = [0.834, 1.425, 0.452, 0.915, 1.309, 0.400, 1.066, 1.367, 0.388, 1.095]
log_every = 50
eval_every = 250
save_every = 250
output = "runs/s4b_noise_clean_seg"
